<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon panier — AURA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo">AURA</a>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="boutique.html">Boutique</a></li>
      <li><a href="boutique.html?category=V%C3%AAtements">Vêtements</a></li>
      <li><a href="boutique.html?category=Accessoires">Accessoires</a></li>
      <li><a href="boutique.html?category=Chaussures">Chaussures</a></li>
    </ul>
    <div class="nav-actions">
      <a href="panier.html" class="cart-link">
        🛍️ Panier <span class="cart-badge" data-cart-count>0</span>
      </a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </nav>
</header>

<div class="section-title" style="margin-top:40px;">
  <h2>Mon panier</h2>
</div>

<div id="cart-root"></div>

<footer class="site-footer">
  <div class="footer-bottom">
    <span>© 2026 AURA. Tous droits réservés.</span>
    <span class="payment-icons">💳 🏦 📱</span>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  function renderCart() {
    const root = document.getElementById("cart-root");
    const items = getCartDetails();

    if (!items.length) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🛍️</div>
          <h2>Votre panier est vide</h2>
          <p>Découvrez nos produits et ajoutez vos coups de cœur.</p>
          <a href="boutique.html" class="btn btn-primary">Voir la boutique</a>
        </div>
      `;
      return;
    }

    const subtotal = getCartSubtotal();
    const shipping = getShippingCost();
    const total = getCartTotal();
    const remaining = FREE_SHIPPING_THRESHOLD - subtotal;

    root.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items">
          ${items.map(item => `
            <div class="cart-item">
              <div class="cart-item-thumb" style="background: linear-gradient(135deg, ${item.color1}, ${item.color2});">${item.emoji}</div>
              <div>
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">${formatPrice(item.price)} × ${item.qty}</div>
                <button class="cart-item-remove" data-remove="${item.id}">Retirer</button>
              </div>
              <div class="qty-selector">
                <button data-decrease="${item.id}" aria-label="Diminuer">−</button>
                <span>${item.qty}</span>
                <button data-increase="${item.id}" aria-label="Augmenter">+</button>
              </div>
              <div style="font-weight:700;">${formatPrice(item.lineTotal)}</div>
            </div>
          `).join("")}
        </div>
        <div class="summary-card">
          <h3 style="margin-bottom:16px;">Récapitulatif</h3>
          ${remaining > 0 ? `<div class="free-shipping-note">Ajoutez ${formatPrice(remaining)} pour la livraison offerte 🚚</div>` : `<div class="free-shipping-note">Livraison offerte ✅</div>`}
          <div class="summary-row"><span>Sous-total</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Livraison</span><span>${shipping === 0 ? "Offerte" : formatPrice(shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
          <a href="paiement.html" class="btn btn-primary btn-block">Passer la commande</a>
          <a href="boutique.html" class="btn btn-outline btn-block" style="margin-top:10px;">Continuer mes achats</a>
        </div>
      </div>
    `;

    root.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => { removeFromCart(btn.dataset.remove); renderCart(); });
    });
    root.querySelectorAll("[data-increase]").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = getCart().find(i => i.id === Number(btn.dataset.increase));
        updateCartQty(btn.dataset.increase, (item ? item.qty : 0) + 1);
        renderCart();
      });
    });
    root.querySelectorAll("[data-decrease]").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = getCart().find(i => i.id === Number(btn.dataset.decrease));
        updateCartQty(btn.dataset.decrease, (item ? item.qty : 0) - 1);
        renderCart();
      });
    });
  }

  renderCart();
</script>

</body>
</html>
