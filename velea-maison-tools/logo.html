<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=block" rel="stylesheet">
<style>
body{margin:0;background:transparent}
.l{display:inline-flex;align-items:center;gap:34px;padding:30px 40px;color:#3E1A26}
.l svg{width:110px;height:110px}
.l span{font-family:'Bodoni Moda',serif;font-size:96px;letter-spacing:.32em;margin-right:-.32em;line-height:1}
.f{width:512px;height:512px;display:grid;place-items:center}
.f svg{width:470px;height:470px}
.sq{width:600px;height:600px;display:grid;place-items:center;background:#FBF6F5}
.sq .l{flex-direction:column;gap:30px}
.sq .l span{font-size:64px}
</style></head><body>
<template id="m"><svg viewBox="0 0 40 40"><defs><radialGradient id="g" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#F7D3C4"/><stop offset=".55" stop-color="#E89A93"/><stop offset="1" stop-color="#C8566F"/></radialGradient></defs><circle cx="20" cy="20" r="18" fill="url(#g)"/><path d="M2.6 22.4c5.4-2.6 11.2-3.9 17.4-3.9s12 1.3 17.4 3.9v4.4c-5.4-2.6-11.2-3.9-17.4-3.9s-12 1.3-17.4 3.9z" fill="#3E1A26"/></svg></template>
<div id="logo" class="l"><i></i><span>VELEA</span></div><br>
<div id="fav" class="f"><i></i></div>
<div id="square" class="sq"><div class="l"><i></i><span>VELEA</span></div></div>
<script>const m=document.getElementById('m').innerHTML;let n=0;document.querySelectorAll('i').forEach(e=>{e.outerHTML=m.replace(/id="g"/,'id="g'+n+'"').replace('url(#g)','url(#g'+n+')');n++;});</script>
</body></html>
