<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paiement — AURA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="logo">AURA</a>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="boutique.html">Boutique</a></li>
    </ul>
    <div class="nav-actions">
      <a href="panier.html" class="cart-link">
        🛍️ Panier <span class="cart-badge" data-cart-count>0</span>
      </a>
    </div>
  </nav>
</header>

<div class="section-title" style="margin-top:40px;">
  <h2>Paiement</h2>
</div>

<div id="checkout-root"></div>

<footer class="site-footer">
  <div class="footer-bottom">
    <span>© 2026 AURA. Tous droits réservés.</span>
    <span class="payment-icons">💳 🏦 📱</span>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  const root = document.getElementById("checkout-root");
  const items = getCartDetails();

  if (!items.length) {
    root.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🛍️</div>
        <h2>Votre panier est vide</h2>
        <p>Ajoutez des produits avant de passer commande.</p>
        <a href="boutique.html" class="btn btn-primary">Voir la boutique</a>
      </div>
    `;
  } else {
    const subtotal = getCartSubtotal();
    const shipping = getShippingCost();
    const total = getCartTotal();

    root.innerHTML = `
      <form class="checkout-layout" id="checkout-form" novalidate>
        <div>
          <div class="form-section">
            <h3>Coordonnées</h3>
            <div class="form-row">
              <div>
                <label for="firstname">Prénom</label>
                <input type="text" id="firstname" required>
                <div class="field-error">Champ requis</div>
              </div>
              <div>
                <label for="lastname">Nom</label>
                <input type="text" id="lastname" required>
                <div class="field-error">Champ requis</div>
              </div>
            </div>
            <div class="form-row single">
              <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
                <div class="field-error">E-mail invalide</div>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3>Adresse de livraison</h3>
            <div class="form-row single">
              <div>
                <label for="address">Adresse</label>
                <input type="text" id="address" required>
                <div class="field-error">Champ requis</div>
              </div>
            </div>
            <div class="form-row three">
              <div>
                <label for="city">Ville</label>
                <input type="text" id="city" required>
                <div class="field-error">Champ requis</div>
              </div>
              <div>
                <label for="zip">Code postal</label>
                <input type="text" id="zip" required maxlength="6">
                <div class="field-error">Invalide</div>
              </div>
              <div>
                <label for="country">Pays</label>
                <input type="text" id="country" value="France" required>
                <div class="field-error">Champ requis</div>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3>Paiement</h3>
            <div class="card-icons">💳 🏦 📱</div>
            <div class="form-row single">
              <div>
                <label for="card-name">Nom sur la carte</label>
                <input type="text" id="card-name" required>
                <div class="field-error">Champ requis</div>
              </div>
            </div>
            <div class="form-row single">
              <div>
                <label for="card-number">Numéro de carte</label>
                <input type="text" id="card-number" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19" required>
                <div class="field-error">Numéro de carte invalide</div>
              </div>
            </div>
            <div class="form-row">
              <div>
                <label for="card-expiry">Expiration (MM/AA)</label>
                <input type="text" id="card-expiry" placeholder="MM/AA" maxlength="5" required>
                <div class="field-error">Date invalide</div>
              </div>
              <div>
                <label for="card-cvc">CVC</label>
                <input type="text" id="card-cvc" inputmode="numeric" placeholder="123" maxlength="4" required>
                <div class="field-error">CVC invalide</div>
              </div>
            </div>
            <div class="secure-note">🔒 Paiement simulé à des fins de démonstration — aucune vraie transaction n'est effectuée.</div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="pay-btn">
            <span id="pay-btn-label">Payer ${formatPrice(total)}</span>
          </button>
        </div>

        <div class="summary-card">
          <h3 style="margin-bottom:16px;">Votre commande</h3>
          ${items.map(item => `
            <div class="order-line">
              <span>${item.name} × ${item.qty}</span>
              <strong>${formatPrice(item.lineTotal)}</strong>
            </div>
          `).join("")}
          <div class="summary-row" style="margin-top:16px;"><span>Sous-total</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Livraison</span><span>${shipping === 0 ? "Offerte" : formatPrice(shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
        </div>
      </form>
    `;

    const form = document.getElementById("checkout-form");
    const cardNumber = document.getElementById("card-number");
    const cardExpiry = document.getElementById("card-expiry");
    const cardCvc = document.getElementById("card-cvc");
    const zip = document.getElementById("zip");

    cardNumber.addEventListener("input", () => {
      cardNumber.value = cardNumber.value.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
    });
    cardExpiry.addEventListener("input", () => {
      let v = cardExpiry.value.replace(/\D/g, "").slice(0, 4);
      if (v.length >= 3) v = v.slice(0, 2) + "/" + v.slice(2);
      cardExpiry.value = v;
    });
    cardCvc.addEventListener("input", () => {
      cardCvc.value = cardCvc.value.replace(/\D/g, "").slice(0, 4);
    });
    zip.addEventListener("input", () => {
      zip.value = zip.value.replace(/\D/g, "").slice(0, 6);
    });

    function setFieldValid(input, valid) {
      input.classList.toggle("invalid", !valid);
      const err = input.parentElement.querySelector(".field-error");
      if (err) err.classList.toggle("visible", !valid);
      return valid;
    }

    function validateForm() {
      let valid = true;
      const requiredText = ["firstname", "lastname", "address", "city", "country", "card-name"];
      requiredText.forEach(id => {
        const el = document.getElementById(id);
        valid = setFieldValid(el, el.value.trim().length > 0) && valid;
      });

      const email = document.getElementById("email");
      valid = setFieldValid(email, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) && valid;

      valid = setFieldValid(zip, /^\d{4,6}$/.test(zip.value.trim())) && valid;

      const digits = cardNumber.value.replace(/\s/g, "");
      valid = setFieldValid(cardNumber, /^\d{13,16}$/.test(digits)) && valid;

      const expiryMatch = cardExpiry.value.match(/^(\d{2})\/(\d{2})$/);
      let expiryValid = false;
      if (expiryMatch) {
        const month = Number(expiryMatch[1]);
        const year = 2000 + Number(expiryMatch[2]);
        if (month >= 1 && month <= 12) {
          const expiryDate = new Date(year, month, 0, 23, 59, 59);
          expiryValid = expiryDate >= new Date();
        }
      }
      valid = setFieldValid(cardExpiry, expiryValid) && valid;

      valid = setFieldValid(cardCvc, /^\d{3,4}$/.test(cardCvc.value.trim())) && valid;

      return valid;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!validateForm()) {
        showToast("Merci de corriger les champs en rouge");
        return;
      }

      const payBtn = document.getElementById("pay-btn");
      const payLabel = document.getElementById("pay-btn-label");
      payBtn.disabled = true;
      payLabel.innerHTML = `<span class="spinner"></span> Traitement du paiement...`;

      /* Paiement simulé : remplace ce bloc par un vrai appel (ex. Stripe Payment Link ou Checkout Session) pour accepter de vrais paiements. */
      setTimeout(() => {
        const order = {
          orderNumber: "AURA-" + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toISOString(),
          customer: {
            firstname: document.getElementById("firstname").value.trim(),
            lastname: document.getElementById("lastname").value.trim(),
            email: document.getElementById("email").value.trim(),
            address: document.getElementById("address").value.trim(),
            city: document.getElementById("city").value.trim(),
            zip: zip.value.trim(),
            country: document.getElementById("country").value.trim()
          },
          items,
          subtotal,
          shipping,
          total
        };
        sessionStorage.setItem("aura_last_order", JSON.stringify(order));
        clearCart();
        window.location.href = "confirmation.html";
      }, 1400);
    });
  }
</script>

</body>
</html>
